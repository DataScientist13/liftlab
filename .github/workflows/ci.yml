name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  # Repo-specific quality gate. The fast profile is a smoke run: it proves the benchmark
  # harness still works end to end and that the sampler converges, which is what can plausibly
  # break on a push. It has far too few replications to assert on coverage, and its gate is
  # disabled accordingly rather than dressed up as a statistical check.
  # The publication profile takes ~20 minutes and runs on release, not per push.
  recovery:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras --dev
      - run: uv run python -m liftlab.recovery --profile fast --check --output "$RUNNER_TEMP/recovery"
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-fast
          path: ${{ runner.temp }}/recovery/

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
