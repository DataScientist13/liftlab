[project]
name = "liftlab"
version = "0.1.0"
description = "Bayesian marketing mix modeling calibrated by geo-incrementality experiments."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "David Itzhakov", email = "david13021998@gmail.com" }]
keywords = ["marketing-mix-modeling", "bayesian", "incrementality", "geo-experiment", "causal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyluach>=2.2",
  "scipy>=1.13",
]

[project.optional-dependencies]
mmm = ["numpyro>=0.15", "jax>=0.4.30", "arviz>=0.19"]

[project.urls]
Homepage = "https://github.com/DataScientist13/liftlab"
Documentation = "https://datascientist13.github.io/liftlab/"
Issues = "https://github.com/DataScientist13/liftlab/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liftlab"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6.9",
  "pre-commit>=3.8",
  "pandas-stubs>=2.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Test bodies are self-documenting and heavily parametrized; annotating every fixture
# argument adds noise without catching anything. Strict typing stays on for `src`.
"tests/**" = ["D100", "D101", "D102", "D103", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src"]

[[tool.mypy.overrides]]
# pyluach ships no type stubs and has no types-* package on PyPI.
module = ["pyluach.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
